services:
  db:
    image: postgres:17
    container_name: bugnbass-db

    environment:
      POSTGRES_DB: bugnbass
      POSTGRES_USER: bugnbass
      POSTGRES_PASSWORD: 1234

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: ./backend

    container_name: bugnbass-app

    depends_on:
      - db

    environment:
      DB_URL: jdbc:postgresql://db:5432/bugnbass
      DB_USER: bugnbass
      DB_PASSWORD: 1234

      MEDIA_ROOT: /data/product_images

    ports:
      - "8080:8080"

    volumes:
      - ./product_images:/data/product_images

volumes:
  postgres-data:
  product-images:
